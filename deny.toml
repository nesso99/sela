# cargo-deny config for Sela (GPL-3.0-or-later).
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Allow-list is minimal: only SPDX licenses that appear in the current
# dependency graph (dual-licensed crates can satisfy via MIT/Apache-2.0, etc.).
# Do NOT allow: OpenSSL (old OpenSSL license is GPL-incompatible),
# GPL-2.0-only, LGPL-2.1-only (without or-later), proprietary, or unknown.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
include-dev = true
unused-allowed-license = "warn"

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0", # webpki-roots (via rustls / sqlx / gpui-pre-reqwest)
]

# Prefer clarify (with license-file hashes) over blanket exceptions.

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
