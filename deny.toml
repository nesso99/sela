# cargo-deny config for Sela (GPL-3.0-or-later).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
# Include examples/benches that pull GPUI so license coverage matches CI builds.

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
# Check licenses that ship in the binary and in CI/dev tooling we actually run.
include-dev = true
unused-allowed-license = "allow"

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
    "NCSA",
    "CDLA-Permissive-2.0",
    # Copyleft we accept (project itself is GPL-3.0-or-later).
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
]

# Do NOT allow: GPL-2.0-only, LGPL-2.1-only (without or-later), proprietary, unknown.
# Prefer clarify (with license-file hashes) over blanket exceptions.

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
