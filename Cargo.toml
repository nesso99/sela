[workspace]
members = [
    "crates/sela-core",
    "crates/sela-drivers",
    "crates/sela-config",
    "crates/sela-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
async-channel = "2"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-kit = "=0.10.0"
# keyring v3 has no default platform store; without features it uses the
# in-process mock and passwords never persist. Enable native backends:
# macOS Keychain, Windows Credential Manager, Linux Secret Service (sync +
# pure-Rust D-Bus session crypto; needs libdbus at link time, already in CI).
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Apache-2.0; used by M2-4 safe-mode classification (no-WHERE + write detection).
sqlparser = { version = "0.64", default-features = false, features = ["std"] }
sqlx = { version = "0.9.1", default-features = false, features = [
    # 0.9 split the old runtime-tokio-rustls combo into runtime + tls features.
    "runtime-tokio",
    "tls-rustls",
    # 0.9 moved `Executor::describe` behind the `macros` feature (enables
    # sqlx-core `offline`). Needed for empty-result column metadata.
    "macros",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "json",
    "rust_decimal",
    # Postgres text-fallback types (M1-9): inet/cidr, macaddr, bit/varbit.
    "ipnetwork",
    "mac_address",
    "bit-vec",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

sela-core = { path = "crates/sela-core" }
sela-drivers = { path = "crates/sela-drivers" }
sela-config = { path = "crates/sela-config" }
