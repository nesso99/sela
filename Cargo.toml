[workspace]
members = [
    "crates/sela-core",
    "crates/sela-drivers",
    "crates/sela-config",
    "crates/sela-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
async-channel = "2"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-kit = "=0.10.0"
keyring = "3"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "json",
    "rust_decimal",
    # Postgres text-fallback types (M1-9): inet/cidr, macaddr, bit/varbit.
    "ipnetwork",
    "mac_address",
    "bit-vec",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

sela-core = { path = "crates/sela-core" }
sela-drivers = { path = "crates/sela-drivers" }
sela-config = { path = "crates/sela-config" }
