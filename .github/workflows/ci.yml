name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full coverage (including Windows) as a safety net.
    - cron: "0 2 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ssh: ${{ steps.filter.outputs.ssh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: filter
        run: |
          set -euo pipefail
          # Push to main, schedule, and manual dispatch always run the full suite.
          if [ "${{ github.event_name }}" = "schedule" ] \
            || [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; }; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "ssh=true" >> "$GITHUB_OUTPUT"
            echo "Treating all code as changed (event=${{ github.event_name }})"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Diffing $BASE...$HEAD"
          mapfile -t files < <(git diff --name-only "$BASE"..."$HEAD" || true)

          code=false
          ssh=false
          for file in "${files[@]+"${files[@]}"}"; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md|docs|docs/*) ;;
              *)
                code=true
                echo "Non-docs change: $file"
                ;;
            esac
            # SSH integration paths (docs/md alone do not set ssh).
            case "$file" in
              *.md|docs|docs/*) ;;
              crates/sela-ssh/*|crates/sela-drivers/*|scripts/run-ssh-bastion.sh|.github/workflows/ci.yml)
                ssh=true
                echo "SSH-related change: $file"
                ;;
            esac
          done

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ssh=$ssh" >> "$GITHUB_OUTPUT"
          echo "code=$code"
          echo "ssh=$ssh"

  check:
    name: check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libsqlite3-dev libssl-dev \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libxrandr-dev libxi-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev \
            libasound2-dev fonts-dejavu-core

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo-deny
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: "licenses bans sources"

  docs:
    name: docs
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link check (offline, internal links)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            README.md
            CHANGELOG.md
            CONTRIBUTING.md
            SECURITY.md
            LICENSE
            docs
            .github/pull_request_template.md
          fail: true

  test:
    name: test (${{ matrix.os }})
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' && success()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libsqlite3-dev libssl-dev \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libxrandr-dev libxi-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev \
            libasound2-dev fonts-dejavu-core

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace

  db-integration:
    name: db-integration
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' && success()
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sela
          POSTGRES_PASSWORD: sela
          POSTGRES_DB: sample
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sela -d sample"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sela
          MYSQL_USER: sela
          MYSQL_PASSWORD: sela
          MYSQL_DATABASE: sample
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -usela -psela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      SELA_POSTGRES_URL: postgres://sela:sela@127.0.0.1:5432/sample?sslmode=disable
      SELA_MYSQL_URL: mysql://sela:sela@127.0.0.1:3306/sample?ssl-mode=disabled
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libsqlite3-dev libssl-dev \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libxrandr-dev libxi-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev \
            libasound2-dev fonts-dejavu-core

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (drivers with Postgres and MySQL)
        run: cargo test -p sela-drivers -- --nocapture

  # Postgres with SSL: throwaway certs generated in the job (never committed).
  db-tls-postgres:
    name: db-tls-postgres
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libsqlite3-dev libssl-dev \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libxrandr-dev libxi-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev \
            libasound2-dev fonts-dejavu-core openssl

      - uses: Swatinem/rust-cache@v2

      - name: Generate TLS certs and start Postgres 16 with SSL
        run: |
          set -euo pipefail
          CERT_DIR="${RUNNER_TEMP}/sela-pg-tls"
          mkdir -p "$CERT_DIR"
          ./scripts/gen-pg-tls-certs.sh "$CERT_DIR"
          # postgres image runs as uid 999
          sudo chown 999:999 "$CERT_DIR/server.key" "$CERT_DIR/server.crt" \
            "$CERT_DIR/ca.crt" "$CERT_DIR/pg_hba.conf"
          sudo chmod 600 "$CERT_DIR/server.key"
          docker run -d --name sela-pg-tls \
            -e POSTGRES_USER=sela \
            -e POSTGRES_PASSWORD=sela \
            -e POSTGRES_DB=sample \
            -p 5433:5432 \
            -v "$CERT_DIR:/certs:ro" \
            postgres:16 \
            -c ssl=on \
            -c ssl_cert_file=/certs/server.crt \
            -c ssl_key_file=/certs/server.key \
            -c hba_file=/certs/pg_hba.conf
          for i in $(seq 1 60); do
            if docker exec sela-pg-tls pg_isready -U sela -d sample; then
              break
            fi
            sleep 1
          done
          docker exec sela-pg-tls pg_isready -U sela -d sample
          echo "SELA_PG_TLS_URL=postgres://sela:sela@127.0.0.1:5433/sample" >> "$GITHUB_ENV"
          echo "SELA_PG_TLS_CA=$CERT_DIR/ca.crt" >> "$GITHUB_ENV"

      - name: cargo test (Postgres TLS)
        run: cargo test -p sela-drivers postgres_tls -- --nocapture

  # SSH bastion in front of Postgres/MySQL (DBs not published to the runner).
  # Throwaway keys generated at runtime by scripts/run-ssh-bastion.sh.
  ssh-integration:
    name: ssh-integration
    needs: [changes, check]
    if: needs.changes.outputs.ssh == 'true' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libsqlite3-dev libssl-dev \
            libdbus-1-dev openssh-client sshpass \
            libvulkan-dev libwayland-dev libxkbcommon-dev \
            libxcb1-dev libx11-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Start SSH bastion + Postgres/MySQL (no DB host ports)
        run: |
          set -euo pipefail
          eval "$(./scripts/run-ssh-bastion.sh)"
          eval "$(ssh-agent -s)"
          ssh-add "$SELA_SSH_KEY"
          # Mask secrets before writing them to GITHUB_ENV.
          echo "::add-mask::$SELA_SSH_PASSWORD"
          echo "::add-mask::$SELA_SSH_KEY_PASSPHRASE"
          echo "::add-mask::$SELA_SSH_DB_PASSWORD"
          {
            echo "SELA_SSH_HOST=$SELA_SSH_HOST"
            echo "SELA_SSH_PORT=$SELA_SSH_PORT"
            echo "SELA_SSH_USER=$SELA_SSH_USER"
            echo "SELA_SSH_PASSWORD=$SELA_SSH_PASSWORD"
            echo "SELA_SSH_KEY=$SELA_SSH_KEY"
            echo "SELA_SSH_KEY_PASSPHRASE=$SELA_SSH_KEY_PASSPHRASE"
            echo "SELA_SSH_KEY_ENCRYPTED=$SELA_SSH_KEY_ENCRYPTED"
            echo "SELA_SSH_KNOWN_HOSTS=$SELA_SSH_KNOWN_HOSTS"
            echo "SELA_SSH_KNOWN_HOSTS_BAD=$SELA_SSH_KNOWN_HOSTS_BAD"
            echo "SELA_SSH_DB_HOST=$SELA_SSH_DB_HOST"
            echo "SELA_SSH_DB_PORT=$SELA_SSH_DB_PORT"
            echo "SELA_SSH_DB_USER=$SELA_SSH_DB_USER"
            echo "SELA_SSH_DB_PASSWORD=$SELA_SSH_DB_PASSWORD"
            echo "SELA_SSH_DB_NAME=$SELA_SSH_DB_NAME"
            echo "SELA_SSH_MYSQL_HOST=$SELA_SSH_MYSQL_HOST"
            echo "SELA_SSH_MYSQL_PORT=$SELA_SSH_MYSQL_PORT"
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SELA_SSH_REQUIRED=1"
          } >> "$GITHUB_ENV"

      - name: cargo test (SSH tunnel)
        run: cargo test -p sela-drivers --test ssh_tunnel -- --nocapture

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - changes
      - check
      - deny
      - docs
      - test
      - db-integration
      - db-tls-postgres
      - ssh-integration
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON"

          code="$(python3 -c 'import json,os; print(json.loads(os.environ["NEEDS_JSON"])["changes"]["outputs"].get("code",""))')"
          ssh="$(python3 -c 'import json,os; print(json.loads(os.environ["NEEDS_JSON"])["changes"]["outputs"].get("ssh",""))')"
          echo "changes.outputs.code=$code"
          echo "changes.outputs.ssh=$ssh"

          # Fail if any needed job failed or was cancelled.
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = []
          for name, info in needs.items():
              result = info.get("result")
              if result in ("failure", "cancelled"):
                  bad.append(f"{name}={result}")
          if bad:
              print("ci-gate failed: jobs in failure/cancelled:", ", ".join(bad))
              sys.exit(1)

          code = needs["changes"]["outputs"].get("code", "")
          ssh = needs["changes"]["outputs"].get("ssh", "")
          heavy = ["check", "deny", "docs", "test", "db-integration", "db-tls-postgres"]
          if code == "true":
              not_ok = []
              for name in heavy:
                  result = needs[name].get("result")
                  if result != "success":
                      not_ok.append(f"{name}={result}")
              if not_ok:
                  print("ci-gate failed: code changed but heavy jobs not all success:", ", ".join(not_ok))
                  sys.exit(1)
          else:
              print("docs-only (or no code changes): heavy jobs may be skipped")

          if ssh == "true":
              result = needs["ssh-integration"].get("result")
              if result != "success":
                  print(f"ci-gate failed: ssh changed but ssh-integration={result}")
                  sys.exit(1)
          else:
              print("no SSH-related changes: ssh-integration may be skipped")

          print("ci-gate passed")
          PY
